<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cari Ruas & STA (Klik Peta)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<!-- ===================== SELECT2 ===================== -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f4f6f8}
h2{margin:10px;font-size:18px}

.card{
  background:#fff;
  margin:10px;
  padding:12px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.15)
}

label{font-size:14px;font-weight:bold}
select,input{
  width:100%;
  padding:8px;
  margin-top:6px;
  margin-bottom:10px;
  font-size:14px
}

button{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  color:#fff;
  background:#0277bd
}
button.secondary{background:#455a64}

#map{
  height:50vh;
  margin:10px;
  border-radius:10px
}

.info{font-size:14px}
</style>
</head>

<body>

<h2>Cari Lokasi Ruas & STA</h2>

<div class="card">
  <label>Nama Ruas Jalan</label>
  <select id="ruasSelect">
    <option value="">-- Pilih Ruas --</option>
  </select>

  <label>STA (contoh: 2+774)</label>
  <input id="staInput" placeholder="Masukkan STA">

  <button onclick="generateFromSTA()">Generate dari STA</button>
</div>

<div id="map"></div>

<div class="card" id="infoCard" style="display:none">
  <div class="info" id="infoText"></div><br>
  <button class="secondary" onclick="openGmaps()">Buka di Google Maps</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let roads=[];
let map=L.map('map').setView([-8.56,115.17],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let marker=null;
let lastLatLng=null;

/* ===================== ENABLE SELECT2 ===================== */
$(document).ready(function() {
    $('#ruasSelect').select2({
        placeholder: "-- Pilih Ruas --",
        width: "100%"
    });
});

/* ===================== LOAD ROADS ===================== */
fetch("roads.json").then(r=>r.json()).then(j=>{
  roads=j;
  const sel=document.getElementById("ruasSelect");

  j.forEach((r,i)=>{
    const o=document.createElement("option");
    o.value=i;
    o.textContent=r.name;
    sel.appendChild(o);
  });

  // refresh Select2 setelah option dimasukkan
  $('#ruasSelect').trigger('change');
});

/* ===================== GEO UTIL ===================== */
const R=6371000;
const toRad=d=>d*Math.PI/180;

function hav(a,b,c,d){
  const dLat=toRad(c-a),dLng=toRad(d-b);
  const x=Math.sin(dLat/2)**2+
    Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

function projectPoint(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay;
  const t=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy);
  const tt=Math.max(0,Math.min(1,t));
  return {x:ax+dx*tt, y:ay+dy*tt, t:tt};
}

function parseSTA(s){
  if(!s.includes("+")) return Number(s);
  const [km,m]=s.split("+").map(Number);
  return km*1000+m;
}
function formatSTA(m){
  const v=Math.round(m);
  const km=Math.floor(v/1000);
  const r=v%1000;
  return `STA ${km}+${String(r).padStart(3,"0")}`;
}

/* ===================== FROM STA ===================== */
function generateFromSTA(){
  const idx=document.getElementById("ruasSelect").value;
  const staStr=document.getElementById("staInput").value;
  if(idx===""||!staStr){alert("Pilih ruas dan isi STA");return;}

  const road=roads[idx];
  let s=parseSTA(staStr)-road.sta_start;
  if(s<0){alert("STA sebelum awal ruas");return;}

  let lat,lng;
  for(let i=0;i<road.polyline.length-1;i++){
    const [lng1,lat1]=road.polyline[i];
    const [lng2,lat2]=road.polyline[i+1];   // ✔ FIX

    const seg=hav(lat1,lng1,lat2,lng2);
    if(s<=seg){
      const t=s/seg;
      lat=lat1+(lat2-lat1)*t;
      lng=lng1+(lng2-lng1)*t;
      break;
    }
    s-=seg;
  }

  if(lat==null){alert("STA melebihi panjang ruas");return;}
  showResult(lat,lng,road.name,parseSTA(staStr));
}

/* ===================== CLICK MAP ===================== */
map.on("click",e=>{
  const {lat,lng}=e.latlng;
  let best={d:Infinity};

  roads.forEach((r,ri)=>{
    let acc=0;
    for(let i=0;i<r.polyline.length-1;i++){
      const [lng1,lat1]=r.polyline[i];
      const [lng2,lat2]=r.polyline[i+1];

      const p=projectPoint(lng,lat,lng1,lat1,lng2,lat2);
      const d=hav(lat,lng,p.y,p.x);

      if(d<best.d){
        const seg=hav(lat1,lng1,lat2,lng2);
        best={d, ri, road:r, sta:r.sta_start+acc+p.t*seg};
      }
      acc+=hav(lat1,lng1,lat2,lng2);
    }
  });

  $('#ruasSelect').val(best.ri).trigger('change');
  document.getElementById("staInput").value=formatSTA(best.sta).replace("STA ","");
  showResult(lat,lng,best.road.name,best.sta);
});

/* ===================== DISPLAY ===================== */
function showResult(lat,lng,ruas,sta){
  if(marker) map.removeLayer(marker);
  marker=L.circleMarker([lat,lng],{
    radius:8,color:"#0d47a1",
    fillColor:"#2196f3",fillOpacity:.9
  }).addTo(map);

  map.setView([lat,lng],18);
  lastLatLng={lat,lng};

  document.getElementById("infoText").innerHTML=
    `<b>${ruas}</b><br>${formatSTA(sta)}<br>
     ${lat.toFixed(6)}, ${lng.toFixed(6)}`;

  document.getElementById("infoCard").style.display="block";
}

function openGmaps(){
  if(!lastLatLng) return;
  window.open(`https://www.google.com/maps?q=${lastLatLng.lat},${lastLatLng.lng}`);
}
</script>

</body>
</html>
