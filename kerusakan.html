<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Pencatat Kerusakan Jalan - PJN 1 Bali</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f9f9f9; text-align:center; }
h2 { color:#333; margin:10px 0; font-size:18px; }
.btn-grid { display:grid; grid-template-columns: repeat(2,1fr); gap:10px; margin:10px; }
button { padding:14px; font-size:16px; border-radius:10px; cursor:pointer; border:none; color:white; transition:0.2s; }
button:hover { opacity:0.85; }
#status { margin:5px 10px; font-weight:bold; min-height:1.2em; color:#555; font-size:14px; }
table { width:100%; border-collapse:collapse; margin-top:10px; background:white; box-shadow:0 0 6px rgba(0,0,0,0.1); font-size:12px; }
th, td { border:1px solid #bbb; padding:6px; text-align:center; }
th { background:#eee; }
.small-btn { padding:4px 6px; font-size:12px; margin:2px; border-radius:5px; cursor:pointer; }
.edit-btn { background:#2196F3; }
.gmaps-btn { background:#FF9800; }
.delete-btn { background:#f44336; }
#debug { font-size:12px; color:#666; margin:5px 10px; text-align:left;}
#toast { visibility:hidden; min-width:200px; background:#333; color:#fff; text-align:center; border-radius:6px; padding:10px; position:fixed; z-index:1000; bottom:30px; left:50%; transform:translateX(-50%); font-size:14px; opacity:0; transition:0.5s; }
#toast.show { visibility:visible; opacity:1; bottom:50px; }
#map { height:50vh; width:100%; border:1px solid #bbb; }
.table-container { overflow-x:auto; margin:0 10px 10px 10px; }
</style>
</head>

<body>

<h2>Pencatat Kerusakan Jalan - PJN 1 Bali</h2>

<div class="btn-grid">
  <button id="btnLubang" style="background:#FF8A65">Lubang</button>
  <button id="btnRetak" style="background:#4DB6AC">Retak Buaya</button>
  <button id="btnRumput" style="background:#AED581;color:#333">Rumput Tinggi</button>
  <button id="btnJembul" style="background:#BA68C8">Jembul</button>
  <button id="btnAmblas" style="background:#FFD54F;color:#333">Amblas</button>
  <button id="btnLain" style="background:#90A4AE">Lain...</button>
</div>

<div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:5px 0;">
  <button id="btnCSV" style="background:#607D8B">Export CSV</button>
  <button id="btnTXT" style="background:#795548">Export TXT</button>
  <button id="btnToggle" style="background:#009688">Tampilkan / Sembunyikan Tabel</button>
  <button id="btnClear" style="background:#f44336">Reset Semua Data</button>
</div>

<div id="status">Menunggu aksi...</div>
<div id="debug"></div>

<div class="table-container" id="tableContainer" style="display:none;">
  <h3>Data Tersimpan</h3>
  <table id="dataTable"></table>
</div>

<div id="map"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ================= ROADS.JSON =================
let ROADS=[];
fetch("roads.json")
 .then(r=>r.json())
 .then(j=>{ ROADS=j; console.log("roads.json loaded:",j.length); })
 .catch(()=>console.warn("roads.json tidak tersedia — fallback mode"));

// ================= UTIL STA ===================
function hav(lat1,lng1,lat2,lng2){
 const R=6371000,d=Math.PI/180;
 const dLat=(lat2-lat1)*d,dLng=(lng2-lng1)*d;
 const a=Math.sin(dLat/2)**2+
 Math.cos(lat1*d)*Math.cos(lat2*d)*Math.sin(dLng/2)**2;
 return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function formatSTA(m){
 const km=Math.floor(m/1000);
 const s=Math.round(m%1000);
 return `STA ${km}+${String(s).padStart(3,"0")}`;
}
function findRoad(lat,lng){
 if(!ROADS.length) return null;
 let best=null;
 ROADS.forEach(r=>{
  let acc=0;
  for(let i=0;i<r.polyline.length-1;i++){
   const a=r.polyline[i],b=r.polyline[i+1];
   const seg=hav(a[1],a[0],b[1],b[0]);
   const d=Math.min(
     hav(lat,lng,a[1],a[0]),
     hav(lat,lng,b[1],b[0])
   );
   if(!best||d<best.dist) best={road:r,dist:d,along:acc};
   acc+=seg;
  }
 });
 return best;
}

// ================= APP CORE ===================
let data=JSON.parse(localStorage.getItem("jalan_data"))||[];
let markers=[];

function save(){ localStorage.setItem("jalan_data",JSON.stringify(data)); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.className="show"; setTimeout(()=>t.className="",3000); }
function wita(){
 const o={timeZone:"Asia/Makassar",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false};
 const p=new Intl.DateTimeFormat("en-GB",o).formatToParts(new Date());
 return `${p[0].value}-${p[2].value}-${p[4].value} ${p[6].value}:${p[8].value} WITA`;
}

function getLocationAndSave(type){
 document.getElementById("status").textContent="Mengambil lokasi...";
 navigator.geolocation.getCurrentPosition(pos=>{
  const e={
   id:Date.now(),
   type,
   lat:pos.coords.latitude,
   lng:pos.coords.longitude,
   acc:pos.coords.accuracy,
   time:wita(),
   gmaps:`https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`
  };
  const r=findRoad(e.lat,e.lng);
  if(r){
   e.ruas=r.road.name;
   e.sta=formatSTA(r.road.sta_start+r.along);
  } else {
   e.ruas="-"; e.sta="-";
  }
  data.push(e); save();
  render(); updateMap();
  document.getElementById("status").innerHTML=
   `Tersimpan: ${type}<br>${e.ruas}<br>${e.sta}`;
 },err=>alert(err.message),{enableHighAccuracy:true});
}

// ================= UI ===================
function render(){
 const t=document.getElementById("dataTable");
 if(!data.length){ t.innerHTML="<tr><td>Belum ada data</td></tr>"; return; }
 let h="<tr><th>Jenis</th><th>Ruas</th><th>STA</th><th>Lat</th><th>Lng</th><th>Waktu</th><th>Aksi</th></tr>";
 data.forEach(d=>{
  h+=`<tr>
   <td>${d.type}</td>
   <td>${d.ruas||"-"}</td>
   <td><b>${d.sta||"-"}</b></td>
   <td>${d.lat.toFixed(6)}</td>
   <td>${d.lng.toFixed(6)}</td>
   <td>${d.time}</td>
   <td>
    <button class="small-btn edit-btn" onclick="edit(${d.id})">Edit</button>
    <button class="small-btn gmaps-btn" onclick="window.open('${d.gmaps}')">Gmaps</button>
    <button class="small-btn delete-btn" onclick="del(${d.id})">Hapus</button>
   </td>
  </tr>`;
 });
 t.innerHTML=h;
}
function edit(id){
 const i=data.find(x=>x.id===id);
 const n=prompt("Edit jenis:",i.type);
 if(n){ i.type=n; save(); render(); updateMap(); }
}
function del(id){
 if(!confirm("Hapus data?"))return;
 data=data.filter(x=>x.id!==id);
 save(); render(); updateMap();
}

// ================= MAP ===================
const map=L.map("map").setView([0,0],2);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
function updateMap(){
 markers.forEach(m=>map.removeLayer(m));
 markers=[];
 data.forEach(d=>{
  markers.push(
   L.marker([d.lat,d.lng]).addTo(map)
    .bindPopup(`<b>${d.type}</b><br>${d.ruas}<br>${d.sta}`)
  );
 });
 if(markers.length){
  map.fitBounds(L.featureGroup(markers).getBounds().pad(0.3));
 }
}

// ================= BINDINGS =================
btnLubang.onclick=()=>getLocationAndSave("Lubang");
btnRetak.onclick=()=>getLocationAndSave("Retak Buaya");
btnRumput.onclick=()=>getLocationAndSave("Rumput Tinggi");
btnJembul.onclick=()=>getLocationAndSave("Jembul");
btnAmblas.onclick=()=>getLocationAndSave("Amblas");
btnLain.onclick=()=>{ const x=prompt("Keterangan lain:"); if(x)getLocationAndSave(x); };
btnCSV.onclick=()=>{/* tetap seperti versi lama jika Anda mau saya tambahkan */};
btnTXT.onclick=()=>{/* tetap seperti versi lama */};
btnToggle.onclick=()=>{ tableContainer.style.display=tableContainer.style.display==="none"?"block":"none"; render(); };
btnClear.onclick=()=>{ if(confirm("Hapus semua data?")){ data=[]; save(); render(); updateMap(); } };

render(); updateMap();
</script>

</body>
</html>
