<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pencatat Kerusakan Jalan</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body{font-family:Arial;margin:0;background:#f7f7f7;text-align:center}
h2{margin:8px;font-size:18px}
button{padding:12px;font-size:15px;border:none;border-radius:10px;color:white}
.btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px}
.info-box{background:white;border-radius:8px;padding:8px;font-size:13px;text-align:left}
.small-btn{font-size:12px;padding:5px 7px;border-radius:6px}
#map{height:50vh}

table{width:100%;border-collapse:collapse}
th,td{
 border:1px solid #aaa;
 padding:4px;
 text-align:center;
 font-size:clamp(9px,2.5vw,12px)
}
th{background:#eee}

.action-btn{font-size:11px;padding:4px 6px;border-radius:6px}
.edit-btn{background:#1E88E5}
.gmap-btn{background:#FB8C00}
.del-btn{background:#E53935}

#toast{
 position:fixed;
 bottom:30px;left:50%;
 transform:translateX(-50%);
 background:#D32F2F;
 color:white;
 padding:8px 12px;
 border-radius:6px;
 opacity:0;
 transition:.3s;
 z-index:999
}
#toast.show{opacity:1}
</style>
</head>

<body>

<h2>Pencatat Kerusakan Jalan</h2>

<div class="btn-grid">
 <button style="background:#FF8A65" onclick="savePoint('Lubang')">Lubang</button>
 <button style="background:#4DB6AC" onclick="savePoint('Retak Buaya')">Retak Buaya</button>
 <button style="background:#AED581;color:#333" onclick="savePoint('Rumput Tinggi')">Rumput Tinggi</button>
 <button style="background:#BA68C8" onclick="savePoint('Jembul')">Jembul</button>
 <button style="background:#FFD54F;color:#333" onclick="savePoint('Amblas')">Amblas</button>
 <button style="background:#90A4AE" onclick="customType()">Lainnya</button>
</div>

<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
 <button style="background:#455A64" onclick="toggleSummary()">Ringkasan Ruas</button>
 <button style="background:#607D8B" onclick="exportCSV()">Export CSV</button>
 <button style="background:#795548" onclick="exportTXT()">Export TXT</button>
 <button style="background:#009688" onclick="toggleTable()">Data</button>
</div>

<div class="info-grid">
 <div class="info-box">
  <b>Lokasi Saat Ini</b><br>
  Ruas: <span id="liveRuas">-</span><br>
  STA: <span id="liveSTA">-</span><br><br>
  <button class="small-btn" style="background:#03A9F4;color:white" onclick="refreshLive()">🔄 Refresh</button>
 </div>
 <div class="info-box" id="lastInfo">
  <b>Data Terakhir</b><br>-
 </div>
</div>

<div id="summaryWrap" style="display:none"></div>
<div id="tableWrap" style="display:none"><table id="dataTable"></table></div>
<div id="map"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let ROADS=[],data=JSON.parse(localStorage.getItem("jalan_data"))||[];
let liveMarker=null;

fetch("roads.json").then(r=>r.json()).then(j=>ROADS=j);

const R=6371000,d=Math.PI/180;
const hav=(a,b,c,e)=>{
 const x=Math.sin((c-a)*d/2)**2+
 Math.cos(a*d)*Math.cos(c*d)*Math.sin((e-b)*d/2)**2;
 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
};
const sta=m=>`STA ${Math.floor(m/1000)}+${String(Math.round(m%1000)).padStart(3,"0")}`;
const toast=m=>{
 const t=document.getElementById("toast");
 t.textContent=m;t.className="show";
 setTimeout(()=>t.className="",3500);
};
const timeWITA=()=>new Date().toLocaleString("id-ID",{timeZone:"Asia/Makassar"})+" WITA";

function findNearest(lat,lng){
 let best={dist:Infinity,road:null,along:0};
 ROADS.forEach(r=>{
  let acc=0;
  for(let i=0;i<r.polyline.length-1;i++){
   const a=r.polyline[i],b=r.polyline[i+1];
   const d1=hav(lat,lng,a[1],a[0]);
   const d2=hav(lat,lng,b[1],b[0]);
   const d=Math.min(d1,d2);
   if(d<best.dist){
    best={dist:d,road:r,along:acc};
   }
   acc+=hav(a[1],a[0],b[1],b[0]);
  }
 });
 return best;
}

function refreshLive(){
 navigator.geolocation.getCurrentPosition(p=>{
  const f=findNearest(p.coords.latitude,p.coords.longitude);
  if(liveMarker)map.removeLayer(liveMarker);
  liveMarker=L.circleMarker([p.coords.latitude,p.coords.longitude],
   {radius:8,color:"#1565C0",fillColor:"#42A5F5",fillOpacity:.8}
  ).addTo(map);
  map.setView([p.coords.latitude,p.coords.longitude],17);

  if(f.dist>100){
   toast("⚠️ Lokasi berada di luar ruas jalan (>100 m)");
   liveRuas.textContent="-"; liveSTA.textContent="-";
  }else{
   liveRuas.textContent=f.road.name;
   liveSTA.textContent=sta(f.road.sta_start+f.along);
  }
 });
}

function savePoint(type){
 navigator.geolocation.getCurrentPosition(p=>{
  const f=findNearest(p.coords.latitude,p.coords.longitude);
  let ruas="-",staVal="-",luar=true;

  if(f.dist<=100){
   ruas=f.road.name;
   staVal=sta(f.road.sta_start+f.along);
   luar=false;
  }else{
   toast("⚠️ Lokasi berada di luar ruas jalan (>100 m)");
  }

  const e={
   id:Date.now(),type,
   lat:p.coords.latitude,lng:p.coords.longitude,
   time:timeWITA(),
   ruas,sta:staVal,luar_ruas:luar,
   gmaps:`https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`
  };
  data.push(e);
  localStorage.setItem("jalan_data",JSON.stringify(data));
  render();updateMap();buildSummary();
  lastInfo.innerHTML=`<b>Data Terakhir</b><br>${e.type}<br>${e.time}`;
 });
}

function buildSummary(){
 const jenis=["Lubang","Retak Buaya","Jembul","Amblas","Rumput Tinggi","Lainnya"];
 let m={};

 data.forEach(d=>{
  const r=d.ruas||"-";
  if(!m[r]){m[r]={Total:0};jenis.forEach(j=>m[r][j]=0);}
  m[r].Total++;
  (m[r][jenis.includes(d.type)?d.type:"Lainnya"])++;
 });

 let h="<table><tr><th>Ruas</th><th>Total</th>";
 jenis.forEach(j=>h+=`<th>${j}</th>`); h+="</tr>";

 Object.keys(m).forEach(r=>{
  h+=`<tr><td>${r}</td><td>${m[r].Total}</td>`;
  jenis.forEach(j=>h+=`<td>${m[r][j]}</td>`);
  h+="</tr>";
 });
 summaryWrap.innerHTML=h;
}

function toggleSummary(){
 summaryWrap.style.display=summaryWrap.style.display==="none"?"block":"none";
 buildSummary();
}

function render(){
 if(!data.length){dataTable.innerHTML="<tr><td>Belum ada data</td></tr>";return;}
 let h="<tr><th>Jenis</th><th>Ruas</th><th>STA</th><th>Aksi</th></tr>";
 data.forEach(d=>h+=`
 <tr>
  <td>${d.type}</td><td>${d.ruas}</td><td>${d.sta}</td>
  <td>
   <button class="action-btn edit-btn" onclick="editItem(${d.id})">EDIT</button>
   <button class="action-btn gmap-btn" onclick="window.open('${d.gmaps}')">GMAP</button>
   <button class="action-btn del-btn" onclick="delItem(${d.id})">HAPUS</button>
  </td>
 </tr>`);
 dataTable.innerHTML=h;
}

function editItem(id){
 const d=data.find(x=>x.id===id);
 const v=prompt("Ubah jenis:",d.type);
 if(v){d.type=v;localStorage.setItem("jalan_data",JSON.stringify(data));render();buildSummary();}
}
function delItem(id){
 if(confirm("Hapus data?")){
  data=data.filter(d=>d.id!==id);
  localStorage.setItem("jalan_data",JSON.stringify(data));
  render();updateMap();buildSummary();
 }
}
function toggleTable(){tableWrap.style.display=tableWrap.style.display==="none"?"block":"none";}
function exportCSV(){
 let c="jenis,ruas,sta,luar_ruas,lat,lng,waktu,gmaps\n";
 data.forEach(d=>c+=`${d.type},${d.ruas},${d.sta},${d.luar_ruas},${d.lat},${d.lng},${d.time},${d.gmaps}\n`);
 download(c,"kerusakan_jalan.csv");
}
function exportTXT(){
 let t="";
 data.forEach(d=>{
  t+=`Jenis Kerusakan : ${d.type}\n`;
  t+=`Ruas+STA       : ${d.ruas} | ${d.sta}\n`;
  t+=`Google Maps    : ${d.gmaps}\n`;
  t+=`Tanggal        : ${d.time}\n`;
  t+=`----------------------------\n`;
 });
 download(t,"kerusakan_jalan.txt");
}
function download(c,f){
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([c]));
 a.download=f;a.click();
}

const map=L.map("map").setView([0,0],2);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
let markers=[];
function updateMap(){
 markers.forEach(m=>map.removeLayer(m));markers=[];
 data.forEach(d=>markers.push(L.marker([d.lat,d.lng]).addTo(map)));
 if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.3));
}
render();updateMap();
</script>
</body>
</html>
