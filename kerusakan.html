<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Pencatat Kerusakan Jalan</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
.card{background:#fff;margin:10px;padding:10px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
h3{margin:5px 0;font-size:15px}
.btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
button{padding:10px;border:none;border-radius:8px;color:#fff;background:#555}
.active{background:#1976D2}
#map{height:45vh;margin:10px;border-radius:10px}
.small{font-size:60%}
</style>
</head>

<body>

<div class="card">
<h3>Jenis Kerusakan</h3>
<div class="btn-grid">
<button onclick="addPoint('Lubang')">Lubang</button>
<button onclick="addPoint('Retak Buaya')">Retak Buaya</button>
<button onclick="addPoint('Rumput Tinggi')">Rumput Tinggi</button>
<button onclick="addPoint('Jembul')">Jembul</button>
<button onclick="addPoint('Amblas')">Amblas</button>
<button onclick="customType()">Lain...</button>
</div>
</div>

<div class="card">
<h3>Aksi Data</h3>
<div class="btn-row">
<button onclick="generateRuas()">Generate Ruas</button>
<button onclick="toggleMode('point')" id="btnPoint" class="active">POINT</button>
<button onclick="toggleMode('heat')" id="btnHeat">HEATMAP</button>
</div>
</div>

<div id="map"></div>

<div class="card">
<h3>Posisi Saat Ini</h3>
<div id="locText" class="small"></div>
<button onclick="refreshLocation()">Refresh Lokasi</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
let data = JSON.parse(localStorage.getItem("jalan_data")||"[]");
let map = L.map('map').setView([-8.56,115.17],15);
let markers=[], heatLayer=null, userMarker=null;
let mode="point";

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

// ===== WORKER =====
const worker = new Worker("worker-gis.js");
fetch("roads.json").then(r=>r.json()).then(j=>{
  worker.postMessage({type:"INIT", payload: Array.isArray(j)?j:[j]});
});

worker.onmessage = e => {
  if(e.data.type==="RESULT_ALL"){
    e.data.results.forEach(r=>{
      let i=data.findIndex(x=>x.id===r.id);
      if(i>=0){ data[i].ruas=r.road; data[i].sta=r.sta; }
    });
    save(); render();
  }
  if(e.data.type==="RESULT_SINGLE"){
    const r=e.data.result;
    document.getElementById("locText").textContent =
      r.road ? `${r.road} | STA ${r.sta}` : "Tidak ditemukan ruas";
  }
};

function save(){localStorage.setItem("jalan_data",JSON.stringify(data))}

function addPoint(type){
 navigator.geolocation.getCurrentPosition(p=>{
  const lat=p.coords.latitude, lng=p.coords.longitude;
  data.push({id:Date.now(),type,lat,lng});
  save(); render();
  map.setView([lat,lng],18);
 });
}
function customType(){ let t=prompt("Jenis"); if(t) addPoint(t); }

function render(){
 markers.forEach(m=>map.removeLayer(m)); markers=[];
 if(heatLayer){map.removeLayer(heatLayer); heatLayer=null}

 if(mode==="point"){
  data.forEach(d=>markers.push(L.marker([d.lat,d.lng]).addTo(map)));
 } else {
  heatLayer=L.heatLayer(data.map(d=>[d.lat,d.lng,1]),{radius:25}).addTo(map);
 }
}

function toggleMode(m){
 mode=m;
 document.getElementById("btnPoint").className=m==="point"?"active":"";
 document.getElementById("btnHeat").className=m==="heat"?"active":"";
 render();
}

function generateRuas(){
 worker.postMessage({type:"GENERATE_ALL", payload:data});
}

function refreshLocation(){
 navigator.geolocation.getCurrentPosition(p=>{
  const lat=p.coords.latitude,lng=p.coords.longitude;
  if(userMarker) map.removeLayer(userMarker);
  userMarker=L.circleMarker([lat,lng],{radius:8,color:"blue"}).addTo(map);
  map.setView([lat,lng],17);
  worker.postMessage({type:"SINGLE_POINT", payload:{lat,lng}});
 });
}

render();
</script>
</body>
</html>
