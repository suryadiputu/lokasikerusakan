<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Pencatat Kerusakan Jalan + STA</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body{font-family:Arial;margin:0;background:#f9f9f9;text-align:center}
h2{margin:8px;font-size:18px}
.btn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px}
button{padding:14px;font-size:15px;border-radius:10px;border:none;color:white}
.small-btn{padding:4px 6px;font-size:12px;border-radius:5px;margin:1px}
.edit-btn{background:#2196F3}
.gmaps-btn{background:#FF9800}
.delete-btn{background:#f44336}
table{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
th,td{border:1px solid #bbb;padding:5px}
th{background:#eee}
#map{height:45vh}
#status{font-size:14px;margin:6px}
#progressWrap{display:none;margin:10px}
progress{width:90%;height:18px}
</style>
</head>

<body>

<h2>Pencatat Kerusakan Jalan</h2>

<div class="btn-grid">
  <button style="background:#FF8A65" onclick="getLocation('Lubang')">Lubang</button>
  <button style="background:#4DB6AC" onclick="getLocation('Retak Buaya')">Retak Buaya</button>
  <button style="background:#AED581" onclick="getLocation('Rumput Tinggi')">Rumput Tinggi</button>
  <button style="background:#BA68C8" onclick="getLocation('Jembul')">Jembul</button>
  <button style="background:#FFD54F;color:#333" onclick="getLocation('Amblas')">Amblas</button>
  <button style="background:#90A4AE" onclick="customType()">Lain...</button>
</div>

<div style="margin:6px">
  <button style="background:#607D8B" onclick="exportCSV()">Export CSV</button>
  <button style="background:#795548" onclick="exportTXT()">Export TXT</button>
  <button style="background:#009688" onclick="toggleTable()">Tabel</button>
  <button style="background:#3F51B5" onclick="generateRuasSTA()">Generate Ruas & STA</button>
  <button style="background:#f44336" onclick="clearAll()">Reset</button>
</div>

<div id="status">Siap...</div>

<div id="progressWrap">
  <progress id="progressBar" value="0" max="100"></progress>
  <div id="progressText">0%</div>
</div>

<div id="tableWrap" style="display:none">
<table id="tbl"></table>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================= DATA ================= */
let data = JSON.parse(localStorage.getItem("jalan_data")||"[]");
let roads=null, markers=[];
let map=L.map('map').setView([-8.5,115.2],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

function save(){localStorage.setItem("jalan_data",JSON.stringify(data));}

/* ================= RECORD ================= */
function getLocation(type){
 navigator.geolocation.getCurrentPosition(p=>{
  const e={
   id:Date.now(),
   type,
   lat:p.coords.latitude,
   lng:p.coords.longitude,
   acc:p.coords.accuracy,
   time:new Date().toLocaleString("id-ID"),
   gmaps:`https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`,
   ruas:"",
   sta:""
  };
  data.push(e); save(); render();
  document.getElementById("status").innerHTML=`Tersimpan ✔ <a href="${e.gmaps}" target="_blank">Maps</a>`;
 },err=>alert(err.message),{enableHighAccuracy:true});
}

function customType(){
 const t=prompt("Jenis kerusakan:");
 if(t) getLocation(t);
}

/* ================= TABLE & MAP ================= */
function render(){
 const t=document.getElementById("tbl");
 if(!data.length){t.innerHTML="<tr><td>Belum ada data</td></tr>";return;}
 let h="<tr><th>Jenis</th><th>Lat</th><th>Lng</th><th>Ruas</th><th>STA</th><th>Aksi</th></tr>";
 markers.forEach(m=>map.removeLayer(m)); markers=[];
 data.forEach(d=>{
  h+=`<tr>
   <td>${d.type}</td>
   <td>${d.lat.toFixed(6)}</td>
   <td>${d.lng.toFixed(6)}</td>
   <td>${d.ruas}</td>
   <td>${d.sta}</td>
   <td>
    <button class="small-btn edit-btn" onclick="editItem(${d.id})">Edit</button>
    <button class="small-btn gmaps-btn" onclick="window.open('${d.gmaps}','_blank')">Maps</button>
    <button class="small-btn delete-btn" onclick="deleteItem(${d.id})">Hapus</button>
   </td>
  </tr>`;
  markers.push(L.marker([d.lat,d.lng]).addTo(map));
 });
 t.innerHTML=h;
}

function editItem(id){
 const i=data.find(x=>x.id===id);
 if(!i)return;
 const n=prompt("Edit jenis:",i.type);
 if(n){i.type=n; save(); render();}
}

function deleteItem(id){
 if(confirm("Hapus data ini?")){
  data=data.filter(x=>x.id!==id);
  save(); render();
 }
}

function toggleTable(){
 const e=document.getElementById("tableWrap");
 e.style.display=e.style.display==="none"?"block":"none";
 render();
}

function clearAll(){
 if(confirm("Hapus semua data?")){
  data=[]; save(); render();
 }
}

/* ================= EXPORT ================= */
function exportCSV(){
 let c="type,lat,lng,ruas,sta,time\n";
 data.forEach(d=>c+=`"${d.type}",${d.lat},${d.lng},"${d.ruas}","${d.sta}","${d.time}"\n`);
 download(c,"data_jalan.csv","text/csv");
}
function exportTXT(){
 let t="";
 data.forEach(d=>t+=`Jenis:${d.type}\nLat:${d.lat}\nLng:${d.lng}\nRuas:${d.ruas}\nSTA:${d.sta}\n\n`);
 download(t,"data_jalan.txt","text/plain");
}
function download(c,f,t){
 let b=new Blob([c],{type:t});
 let a=document.createElement("a");
 a.href=URL.createObjectURL(b); a.download=f; a.click();
}

/* ================= GIS ================= */
function haversine(lat1,lng1,lat2,lng2){
 const R=6371000,toRad=x=>x*Math.PI/180;
 const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
 const a=Math.sin(dLat/2)**2+
  Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
 return 2*R*Math.asin(Math.sqrt(a));
}

function staAlongPolyline(point, poly){
 let acc=0,best={dist:1e12,sta:0};
 for(let i=1;i<poly.length;i++){
  const p1=poly[i-1],p2=poly[i];
  const seg=haversine(p1[1],p1[0],p2[1],p2[0]);
  const d=haversine(point.lat,point.lng,p2[1],p2[0]);
  if(d<best.dist) best={dist:d,sta:acc};
  acc+=seg;
 }
 return best;
}

/* ================= GENERATE + PROGRESS ================= */
async function generateRuasSTA(){
 document.getElementById("status").innerText="Mengolah GIS...";
 document.getElementById("progressWrap").style.display="block";
 const bar=document.getElementById("progressBar");
 const txt=document.getElementById("progressText");

 roads = roads || await fetch("roads.json").then(r=>r.json());

 let total=data.length, done=0;

 for(const d of data){
  if(d.ruas){done++;continue;}

  let bestRoad=null,bestSta=0,minDist=1e12;

  roads.forEach(r=>{
    const res=staAlongPolyline(d,r.polyline);
    if(res.dist<minDist){
      minDist=res.dist;
      bestRoad=r;
      bestSta=r.sta_start+res.sta;
    }
  });

  if(bestRoad){
    d.ruas=bestRoad.name;
    d.sta="STA "+Math.floor(bestSta/1000)+"+"+
      Math.floor(bestSta%1000).toString().padStart(3,"0");
  }

  done++;
  const pct=Math.round(done/total*100);
  bar.value=pct; txt.innerText=pct+"%";
  await new Promise(r=>setTimeout(r,0)); // allow UI refresh
 }

 save(); render();
 document.getElementById("status").innerText="Generate selesai ✔";
}

/* ================= INIT ================= */
render();
</script>
</body>
</html>
