<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pencatat Kerusakan Jalan</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body{font-family:Arial;margin:0;background:#f4f6f8}
h2{text-align:center;margin:10px 0}

.card{
 background:#fff;
 margin:10px;
 padding:10px;
 border-radius:12px;
 box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.btn-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}

button{
 padding:12px;
 border:none;
 border-radius:10px;
 font-size:14px;
 color:#fff;
}

.action-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:8px;
}
@media(min-width:768px){
 .action-grid{
  display:flex;
  justify-content:center;
 }
}

.tbl-btn{
 background:#455A64;
 color:white;
 border:none;
 border-radius:6px;
 font-size:12px;
 padding:4px 6px;
 margin:1px;
}

#map{height:45vh;margin:10px;border-radius:10px}
#status{text-align:center;font-size:14px}

progress{width:100%;height:16px}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #bbb;padding:5px}
th{background:#eee}
</style>
</head>

<body>

<h2>Pencatat Kerusakan Jalan</h2>

<!-- PANEL 1 -->
<div class="card">
 <b>Jenis Kerusakan</b>
 <div class="btn-grid">
  <button style="background:#FF8A65" onclick="rec('Lubang')">Lubang</button>
  <button style="background:#4DB6AC" onclick="rec('Retak Buaya')">Retak Buaya</button>
  <button style="background:#AED581" onclick="rec('Rumput Tinggi')">Rumput Tinggi</button>
  <button style="background:#BA68C8" onclick="rec('Jembul')">Jembul</button>
  <button style="background:#FFD54F;color:#333" onclick="rec('Amblas')">Amblas</button>
  <button style="background:#90A4AE" onclick="custom()">Lain...</button>
 </div>
</div>

<!-- PANEL 2 -->
<div class="card">
 <b>Lokasi Saat Ini</b>
 <div id="locInfo">Belum ada lokasi</div><br>
 <button style="background:#2196F3" onclick="refreshLocation()">Refresh Lokasi</button>
</div>

<!-- PANEL 3 -->
<div class="card">
 <b>Aksi Data</b>
 <div class="action-grid">
  <button style="background:#607D8B" onclick="exportCSV()">Export CSV</button>
  <button style="background:#795548" onclick="exportTXT()">Export TXT</button>
  <button style="background:#009688" onclick="toggleTable()">Tabel</button>
  <button style="background:#3F51B5" onclick="generateGIS()">Generate Ruas</button>
  <button style="background:#f44336" onclick="resetAll()">Reset</button>
 </div>
</div>

<div id="status">Siap...</div>

<div id="progressWrap" class="card" style="display:none">
 <progress id="prog" value="0" max="100"></progress>
 <div id="progText">0%</div>
</div>

<div id="tableWrap" class="card" style="display:none">
 <table id="tbl"></table>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let data=JSON.parse(localStorage.getItem("jalan_data")||"[]");
let map=L.map('map').setView([-8.5,115.2],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

let markers=[],userMarker,userCircle;
let roadsCache=null;

function save(){localStorage.setItem("jalan_data",JSON.stringify(data));}
function wita(){return new Intl.DateTimeFormat("id-ID",{timeZone:"Asia/Makassar",dateStyle:"short",timeStyle:"short"}).format(new Date())+" WITA";}

async function loadRoads(){
 if(!roadsCache) roadsCache=await fetch("roads.json").then(r=>r.json());
 return roadsCache;
}

/* === RECORD === */
function rec(type){
 navigator.geolocation.getCurrentPosition(p=>{
  data.push({
   id:Date.now(),
   type,
   lat:p.coords.latitude,
   lng:p.coords.longitude,
   time:wita(),
   ruas:"",
   sta:"",
   gmaps:`https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`
  });
  save();render();
  status.innerText="Tersimpan ✔";
 },e=>alert(e.message),{enableHighAccuracy:true});
}
function custom(){const t=prompt("Jenis kerusakan:");if(t)rec(t);}

/* === REFRESH LOKASI === */
async function refreshLocation(){
 const roads=await loadRoads();
 navigator.geolocation.getCurrentPosition(p=>{
  if(userMarker)map.removeLayer(userMarker);
  if(userCircle)map.removeLayer(userCircle);

  userMarker=L.circleMarker([p.coords.latitude,p.coords.longitude],{
   radius:8,color:"#2196F3",fillOpacity:1
  }).addTo(map);

  userCircle=L.circle([p.coords.latitude,p.coords.longitude],{
   radius:p.coords.accuracy,color:"#2196F3",fillOpacity:.2
  }).addTo(map);

  map.setView([p.coords.latitude,p.coords.longitude],17);

  const worker=new Worker("worker-gis.js");
  worker.postMessage({
   data:[{lat:p.coords.latitude,lng:p.coords.longitude}],
   roads
  });

  worker.onmessage=e=>{
   const r=e.data.result[0];
   document.getElementById("locInfo").innerHTML=
    `Lat: ${p.coords.latitude.toFixed(6)}<br>
     Lng: ${p.coords.longitude.toFixed(6)}<br>
     Ruas: ${r.ruas}<br>
     STA: ${r.sta}`;
   worker.terminate();
  };
 });
}

/* === GENERATE GIS === */
async function generateGIS(){
 const roads=await loadRoads();
 const worker=new Worker("worker-gis.js");

 document.getElementById("progressWrap").style.display="block";
 document.getElementById("status").innerText="Mengolah GIS...";

 worker.postMessage({data,roads});

 worker.onmessage=e=>{
  if(e.data.progress!==undefined){
   prog.value=e.data.progress;
   progText.innerText=e.data.progress+"%";
  }
  if(e.data.done){
   data=e.data.result;
   save();render();
   status.innerText="Generate selesai ✔";
   worker.terminate();
   setTimeout(()=>progressWrap.style.display="none",5000);
  }
 };
}

/* === TABLE === */
function render(){
 const t=document.getElementById("tbl");
 if(!data.length){t.innerHTML="<tr><td>Belum ada data</td></tr>";return;}

 let h="<tr><th>Jenis</th><th>Ruas + STA</th><th>Koordinat</th><th>Waktu</th><th>Aksi</th></tr>";
 markers.forEach(m=>map.removeLayer(m));markers=[];

 data.forEach(d=>{
  h+=`<tr>
   <td>${d.type}</td>
   <td>${d.ruas} ${d.sta}</td>
   <td>${d.lat.toFixed(6)}, ${d.lng.toFixed(6)}</td>
   <td>${d.time}</td>
   <td>
    <button class="tbl-btn" onclick="edit(${d.id})">Edit</button>
    <button class="tbl-btn" onclick="window.open('${d.gmaps}')">Maps</button>
    <button class="tbl-btn" onclick="del(${d.id})">Hapus</button>
   </td>
  </tr>`;
  markers.push(L.marker([d.lat,d.lng]).addTo(map));
 });

 t.innerHTML=h;
}

function edit(id){
 const d=data.find(x=>x.id===id);
 const n=prompt("Edit jenis:",d.type);
 if(n){d.type=n;save();render();}
}
function del(id){if(confirm("Hapus data?")){data=data.filter(x=>x.id!==id);save();render();}}
function toggleTable(){tableWrap.style.display=tableWrap.style.display==="none"?"block":"none";render();}
function resetAll(){if(confirm("Reset semua data?")){data=[];save();render();}}

/* === EXPORT === */
function exportCSV(){
 let c="Jenis Kerusakan,Ruas+STA,Koordinat,Waktu (WITA),Google Maps\n";
 data.forEach(d=>{
  c+=`"${d.type}","${d.ruas} ${d.sta}","${d.lat},${d.lng}","${d.time}","${d.gmaps}"\n`;
 });
 download(c,"kerusakan_jalan.csv","text/csv");
}
function exportTXT(){
 let t="";
 data.forEach(d=>{
  t+=`Jenis: ${d.type}\nRuas+STA: ${d.ruas} ${d.sta}\nKoordinat: ${d.lat},${d.lng}\nWaktu: ${d.time}\nMaps: ${d.gmaps}\n\n`;
 });
 download(t,"kerusakan_jalan.txt","text/plain");
}
function download(c,f,t){let b=new Blob([c],{type:t});let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=f;a.click();}

render();
</script>
</body>
</html>
